<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB Asset Extractor</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="workspace">
        
        <!-- HEADER -->
        <header class="sidebar-header">
            <div class="brand">
                <span class="status-dot pulsing"></span>
                <span class="brand-title" id="brandTitle">FB_IMAGE_<b>HD</b></span>
            </div>
            <div style="display: flex; gap: 6px;">
                <button id="langToggle" class="control-tab-btn" title="Cambiar idioma">EN</button>
                <button id="themeToggle" class="control-tab-btn" title="Alternar Espectro Visual">🌓</button>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <div class="inspector-grid">
            
            <!-- Profile Section -->
            <section id="profileSection" class="asset-row">
                <div class="asset-meta">
                    <span class="meta-label" data-i18n-asset="profile">RECURSO 01</span>
                    <h2 class="meta-title" data-i18n-title="profile">Foto de Perfil</h2>
                </div>
                
                <div class="viewer-wrapper">
                    <div id="profileImageContainer" class="asset-canvas empty-state" title="Click para expandir"></div>
                    
                    <div class="control-bar">
                        <button id="downloadProfileBtn" class="action-trigger primary-trigger" disabled>
                            Descargar Original
                        </button>
                        <button id="upscaleProfileBtn" class="action-trigger secondary-trigger" disabled>
                            Reescalar x2
                        </button>
                    </div>
                </div>

                <div id="upscaledContainer" class="ia-extension hidden">
                    <div class="ia-header">
                        <span class="ia-indicator">PROCESAMIENTO CANVAS IA</span>
                    </div>
                    <div id="upscaledImageContainer" class="asset-canvas-sm" title="Click para expandir"></div>
                    <button id="downloadUpscaledBtn" class="action-trigger success-trigger" disabled>
                        Exportar Flujo HD (.png)
                    </button>
                </div>
            </section>

            <!-- Cover Section -->
            <section id="coverSection" class="asset-row">
                <div class="asset-meta">
                    <span class="meta-label" data-i18n-asset="cover">RECURSO 02</span>
                    <h2 class="meta-title" data-i18n-title="cover">Foto de Portada</h2>
                </div>
                
                <div class="viewer-wrapper">
                    <div id="coverImageContainer" class="asset-canvas empty-state" title="Click para expandir"></div>
                    
                    <div class="control-bar">
                        <button id="downloadCoverBtn" class="action-trigger primary-trigger" disabled>
                            Descargar Portada
                        </button>
                    </div>
                </div>
            </section>
            
        </div>

        <!-- FOOTER - Buy me a Coffee (izquierda) + GitHub (derecha) -->
        <footer class="console-footer">
            <div id="errorMessage" class="console-toast hidden"></div>
            <div class="footer-links">
                <!-- Izquierda: Buy me a Coffee -->
                <div class="footer-left">
                    <a href="https://www.paypal.com/donate/?hosted_button_id=62FYVTF5AM2NJ" 
                       id="donateButton" 
                       target="_blank" 
                       rel="noopener noreferrer"
                       class="footer-link donate-link">
                        <svg class="footer-icon" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 24 24" width="18" height="18">
                            <path d="M12 7.317c3.968 0 7.463.542 8.846.788V5.324a.998.998 0 0 0-.719-.959l-2.629-.772v-.526a.999.999 0 0 0-.432-.823C16.993 2.193 15.228 1 11.992 1 8.803 1 7.003 2.186 6.928 2.237a1.003 1.003 0 0 0-.441.83v.527l-2.615.771a1 1 0 0 0-.717.959v2.781c1.383-.246 4.878-.788 8.846-.788Z" fill="currentColor"/>
                            <ellipse cx="12" cy="14.606" rx="1.19" ry="1.368" fill="currentColor"/>
                            <path d="M15.047 13.606h4.398l.444-3.632c-1.588-.256-4.598-.657-7.889-.657s-6.302.401-7.889.657l.444 3.632h4.398c.405-1.37 1.618-2.368 3.047-2.368s2.642.997 3.047 2.368ZM15.047 15.606c-.405 1.37-1.618 2.368-3.047 2.368s-2.642-.997-3.047-2.368H4.8l.714 5.837a1 1 0 0 0 .616.805c.076.031 1.898.751 5.87.751s5.794-.721 5.87-.751a1 1 0 0 0 .616-.805l.714-5.837h-4.154Z" fill="currentColor"/>
                        </svg>
                        <span id="donateText" class="footer-text">Support ¯\(°_o)/¯ me 💌</span>
                    </a>
                </div>

                <!-- Derecha: GitHub -->
                <div class="footer-right">
                    <a href="https://github.com/coccoa-sudo" 
                       id="githubButton" 
                       target="_blank" 
                       rel="noopener noreferrer"
                       class="footer-link github-link">
                        <svg class="footer-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                            <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.03-2.682-.103-.253-.447-1.27.098-2.646 0 0 .84-.269 2.75 1.025.8-.223 1.65-.334 2.5-.334.85 0 1.7.111 2.5.334 1.91-1.294 2.75-1.025 2.75-1.025.545 1.376.201 2.393.099 2.646.64.698 1.03 1.591 1.03 2.682 0 3.841-2.337 4.687-4.565 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.161 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
                        </svg>
                        <span class="footer-text">GitHub</span>
                    </a>
                </div>
            </div>
        </footer>

        <!-- MODAL -->
        <div id="imageViewerModal" class="viewer-modal">
            <button class="viewer-close" id="closeModalBtn" aria-label="Cerrar visor">&times;</button>
            <div class="viewer-modal-content">
                <div class="viewer-image-container" id="modalImageClip">
                    <img id="modalTargetImage" src="" alt="Vista previa expandida">
                </div>
                <div id="modalCaption" class="viewer-caption"></div>
            </div>
        </div>
        
    </div>

    <!-- Script principal (siempre al final) -->
    <script src="popup.js"></script>
</body>
</html>
